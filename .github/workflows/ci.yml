name: Tests

permissions:
  contents: write

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # 全部测试都是零依赖标准库实现，不需要 pip install
      # GUI 冒烟测试需要真实显示器，CI 上跳过（本地跑 tests/test_gui.py）
      # 密钥防线：项目默认不带任何密钥，用户自己配 .env（该文件已被 .gitignore）
      - name: Secret scan
        run: |
          set +e
          hits=$(grep -rnE "sk-[A-Za-z0-9]{20,}" \
            --include="*.py" --include="*.json" --include="*.md" \
            --include="*.yml" --include="*.vbs" --include="*.example" . \
            | grep -v "^\./\.git/")
          if [ -n "$hits" ]; then
            echo "::error::源码里出现疑似真实密钥"
            echo "$hits"
            exit 1
          fi
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env 被提交进版本库了"
            exit 1
          fi
          echo "secret scan: 干净"

      - name: Run test suites (non-GUI)
        run: |
          set +e  # Actions 的 bash 默认 -e 会套件一失败就终止，这里要收集全部失败
          pass=0; fail=0; failed=""
          mkdir -p _ci
          for f in tests/test_*.py; do
            name=$(basename "$f" .py)
            if [ "$name" = "test_gui" ]; then continue; fi
            python "$f" > "_ci/$name.log" 2>&1
            r=$(tail -1 "_ci/$name.log")
            echo "$name: $r"
            case "$r" in
              *"全部通过"*) pass=$((pass+1));;
              *) fail=$((fail+1)); failed="$failed $name"; echo "::error::FAIL $name";;
            esac
          done
          python agent.py --selftest > "_ci/_selftest.log" 2>&1 || fail=$((fail+1))
          echo "suites passed: $pass, failed: $fail ($failed)"
          [ "$fail" -eq 0 ]

      # 失败时把完整日志推到 ci-logs 分支，方便离线定位（成功时跳过）
      - name: Dump logs to ci-logs branch
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git checkout -B ci-logs 2>/dev/null || true
          git rm -rf --cached . -q 2>/dev/null || true
          git add -f _ci
          git commit -m "ci failure logs (${GITHUB_SHA::7})" -q || exit 0
          git push -f origin ci-logs
        env:
          GITHUB_TOKEN: ${{ github.token }}

  node:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ts-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # TypeScript 版同样零 npm 依赖：Node 原生类型剥离跑 .ts，node --test 跑测试
      - name: Selftest
        run: npm run selftest

      - name: Tests
        run: npm test
